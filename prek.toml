[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-added-large-files" },
  { id = "check-merge-conflict" },
  { id = "check-toml" },
  { id = "check-yaml" },

]

[[repos]]
repo = "local"
hooks = [
  { id = "clang-format", name = "clang-format", entry = 'mise format', language = "system", pass_filenames = false },
  { id = "ruff-format", name = "ruff-format", entry = "uv run --directory python ruff format", language = "system", pass_filenames = false },
]
